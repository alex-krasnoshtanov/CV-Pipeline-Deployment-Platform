default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

# The commitizen commit-msg hook was removed. pre-commit builds it from source,
# which needs poetry-core>=2.0, and the pip seeded into its isolated
# environment is too old to see those releases - so `pre-commit install` fails
# outright and blocks every commit.
#
# Conventional commit messages are still enforced where it matters: PR titles
# are checked by .github/workflows/pr-title.yml, and commitizen itself stays in
# the dev dependency group, so `uv run cz commit` still works.

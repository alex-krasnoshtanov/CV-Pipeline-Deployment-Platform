name: PR Title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

jobs:
  check-title:
    # Dependabot writes its own titles ("Bump the frontend-minor-patch group in
    # /apps/frontend with 11 updates") and cannot be told to use conventional
    # commits. Without this exemption every bot PR fails a check it has no way
    # to pass, which trains everyone to ignore a red X on dependency updates.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title follows conventional commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The group repository required a ticket reference, e.g. feat(#123).
          # There is no issue tracker behind this repository, so the scope is
          # optional here: "feat: description" and "feat(api): description"
          # both pass. Matches what commitizen enforces locally via pre-commit.
          printf '%s\n' "$PR_TITLE" | grep -qE '^(feat|fix|hotfix|docs|chore|test|style|refactor|ci|build|perf)(\([^)]+\))?!?: .+' \
            || (echo "PR title must look like: type(optional-scope): description" && exit 1)


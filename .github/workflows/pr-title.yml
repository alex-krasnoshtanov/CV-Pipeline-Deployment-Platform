name: PR Title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title follows conventional commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" | grep -qE '^(feat|fix|hotfix|docs|chore|test|style|refactor|ci)\(#[0-9]+\): .+' \
            || (echo "PR title does not match required format: type(#ticket-id): description" && exit 1)


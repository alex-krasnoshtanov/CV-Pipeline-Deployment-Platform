name: Docs

# Builds the Sphinx documentation on every change that could affect it.
#
# The GitHub Pages deploy job from the group repository is deliberately not
# carried over: Pages on a private repository needs a paid plan, so the job
# would fail on every run. Re-enable it after this repository goes public by
# turning on Pages in the settings and restoring a deploy job that consumes the
# artefact uploaded below.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "packages/cv-pipeline/src/**"
      - "apps/backend/src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "packages/cv-pipeline/src/**"
      - "apps/backend/src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The docs group pulls sphinx, autoapi, furo and myst-parser. autoapi
      # reads source statically rather than importing it, so torch and fastapi
      # are never loaded at build time.
      - name: Install dependencies
        run: uv sync --group docs

      - name: Generate OpenAPI Markdown
        run: uv run scripts/generate_openapi_docs.py

      - name: Build HTML
        working-directory: docs
        run: make html

      - name: Upload built site
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/build/html
          retention-days: 7

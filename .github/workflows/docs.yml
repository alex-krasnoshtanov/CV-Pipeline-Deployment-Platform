name: Docs

# Builds the Sphinx documentation on every change that could affect it, and
# publishes it to GitHub Pages from main.
#
# Pull requests build only. A PR cannot deploy, both because deploy-pages needs
# an id-token this workflow only grants on main and because publishing an
# unreviewed branch over the live site is the wrong default.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "packages/cv-pipeline/src/**"
      - "apps/backend/src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "packages/cv-pipeline/src/**"
      - "apps/backend/src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Read is enough to build. The deploy job widens this for itself; keeping the
# default narrow means the build job cannot publish even by accident.
permissions:
  contents: read

# One deploy at a time, and never cancel one in flight: an interrupted
# deploy-pages can leave the site serving a half-uploaded artefact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The docs group pulls sphinx, autoapi, furo and myst-parser. autoapi
      # reads source statically rather than importing it, so torch and fastapi
      # are never loaded at build time.
      - name: Install dependencies
        run: uv sync --group docs

      - name: Generate OpenAPI Markdown
        run: uv run scripts/generate_openapi_docs.py

      - name: Build HTML
        working-directory: docs
        run: make html

      # Two uploads, on purpose. The Pages artefact is what deploy consumes;
      # the plain artefact is what you download to inspect a PR build, which
      # is never published anywhere.
      - name: Upload the Pages artefact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build/html

      - name: Upload built site for inspection
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/build/html
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "packages/cv-pipeline/src/**"
      - "apps/backend/src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "packages/cv-pipeline/src/**"
      - "apps/backend/src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Serialize Pages deploys: queue newer runs instead of cancelling in-flight ones.
# cancel-in-progress: false prevents the "higher priority waiting request" error
# that fires when back-to-back merges race to deploy the same Pages environment.
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Build on every push + PR.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.20"

      - name: Install dependencies
        # docs group pulls sphinx + autoapi + furo + myst-parser.
        # Main package sync also picks up cv_pipeline + api for
        # autoapi's static parser (it reads source, doesn't import,
        # so torch/fastapi are not actually loaded at build time).
        run: uv sync --group docs

      - name: Generate OpenAPI Markdown
        run: uv run scripts/generate_openapi_docs.py

      - name: Build HTML
        working-directory: docs
        run: make html

      - name: Upload build artefact
        # Only upload on main — PRs just need build-to-pass.
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  # Deploy only from main.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

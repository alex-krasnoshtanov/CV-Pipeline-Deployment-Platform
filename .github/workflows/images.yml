name: Images

# Builds and publishes the backend, frontend and Prometheus images to this
# repository's own GitHub Container Registry namespace.
#
# This replaces the group repository's deploy pipeline. There is deliberately
# no deployment step: the cloud tier is documented but never provisioned, and
# the on-premise tier pulls these images through Portainer by hand.
#
# Authentication uses the built-in GITHUB_TOKEN. No repository secrets are
# required, which is the main reason GHCR was chosen over Docker Hub.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The backend and frontend Dockerfiles COPY from repository-root
          # paths (pyproject.toml, packages/cv-pipeline, apps/frontend/...),
          # because the Python workspace spans the monorepo. Their build
          # context has to be the repository root; the root .dockerignore keeps
          # the context small. Prometheus copies only files sitting beside it,
          # so it takes its own directory.
          - image: backend
            context: .
            dockerfile: apps/backend/Dockerfile
          - image: frontend
            context: .
            dockerfile: apps/frontend/Dockerfile
          - image: prometheus
            context: infra/monitoring/prometheus
            dockerfile: infra/monitoring/prometheus/Dockerfile
    steps:
      - uses: actions/checkout@v7

      # GHCR rejects uppercase path segments, and github.repository is
      # "alex-krasnoshtanov/CV-Pipeline-Deployment-Platform" verbatim. Lowercase it rather
      # than relying on the registry to be forgiving.
      - name: Compute image name
        id: name
        run: echo "value=${REGISTRY}/${GITHUB_REPOSITORY,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}

      - name: Log in to GHCR
        # Skipped on pull requests: a fork PR has no write access, and nothing
        # is pushed from a PR anyway.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.value }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Pull requests build only. They prove the Dockerfile still works
          # without publishing an image for an unreviewed change.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

services:
  backend:
    build:
      context: ../../
      dockerfile: apps/backend/Dockerfile
    image: cv-platform/backend:local
    environment:
      MODEL_VERSION: ${MODEL_VERSION:-unet-v1}
      CV_PIPELINE_CACHE_DIR: /models
      DB_URL: postgresql+asyncpg://${POSTGRES_USER:-cvuser}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-cvdb}
      LOG_LEVEL: INFO
      API_KEY: ${API_KEY:?API_KEY must be set}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY must be set}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://localhost:8000/auth/github/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set}
      JWT_TTL_MIN: ${JWT_TTL_MIN:-60}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      FEEDBACK_STORAGE_BACKEND: ${FEEDBACK_STORAGE_BACKEND:-local}
      FEEDBACK_STORAGE_LOCAL_DIR: ${FEEDBACK_STORAGE_LOCAL_DIR:-/data/feedback}
      FEEDBACK_STORAGE_BLOB_CONNECTION_STRING: ${FEEDBACK_STORAGE_BLOB_CONNECTION_STRING:-}
      FEEDBACK_STORAGE_BLOB_CONTAINER: ${FEEDBACK_STORAGE_BLOB_CONTAINER:-}
    ports:
      - "8000:8000"
    # No env_file here on purpose. The environment: block above is the
    # complete allow-list of variables the local backend receives.
    # Loading the shared configs/env/.env wholesale would inject
    # cloud-only settings (e.g. MODEL_ENDPOINT_URL), which would flip
    # the backend into azure_ml serving mode and make local depend on
    # the cloud endpoint. Local must stay self-contained: any new
    # local var goes in the environment: block above, explicitly.
    volumes:
      - models:/models
      - feedback-data:/data/feedback
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  frontend:
      build:
        context: ../../
        dockerfile: apps/frontend/Dockerfile
      ports:
        - "3000:3000"
      environment:
        BACKEND_URL: http://backend:8000
        # Operational dashboard reads time-series from Prometheus (server-side
        # only; never exposed to the browser).
        PROMETHEUS_URL: http://prometheus:9090
      depends_on:
        backend:
          condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cvdb}
      POSTGRES_USER: ${POSTGRES_USER:-cvuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cvuser} -d ${POSTGRES_DB:-cvdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Operational monitoring. Builds the templated image in
  # infra/monitoring/prometheus and scrapes the backend's /metrics. The SAME
  # image runs on-prem and in cloud; only BACKEND_TARGET / SCRAPE_SCHEME change.
  # Starts as soon as the backend container exists (service_started, not
  # _healthy) so the Prometheus UI is up quickly; it just shows the backend
  # target as down until the model finishes loading.
  prometheus:
    build:
      context: ../../infra/monitoring/prometheus
    image: cv-platform/prometheus:local
    environment:
      BACKEND_TARGET: backend:8000
      SCRAPE_SCHEME: http
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  models:
  prometheus_data:
  postgres_data:
  feedback-data:
